name: upstream

# Fails (and emails the repo owner) when emilkowalski/skills moves past the commit this port is based on.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# The job only reads the checkout and the public upstream repo.
permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: tools/upstream-diff.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
