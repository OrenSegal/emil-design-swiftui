name: check

on:
  push:
  pull_request:

# Both jobs only read the checkout.
permissions:
  contents: read

jobs:
  structure:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/validate.sh

  snippets:
    timeout-minutes: 30
    # Typechecks every ```swift block against the iOS 18 simulator SDK in Swift 6 mode.
    # Needs an Xcode whose SDK knows the iOS 26 APIs the skills gate behind #available.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Typecheck snippets
        # write-swift is Emil's original, unchanged; its examples call made-up helpers on purpose.
        run: tools/check-snippets.sh $(ls skills/*/*.md | grep -v '/write-swift/') *.md

  package:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcrun swift test
